services:
  whenfree:
    build: .
    container_name: whenfree
    user: "1000:1000"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    # environment:
    #   # Days before meetings are auto-purged (default 180; 0 disables).
    #   - WHENFREE_EXPIRE_DAYS=180
    restart: unless-stopped
